[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dtm-buildsheet"
version = "0.7.0"
description = "GUI-first DTM build sheet generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lxml>=5.0,<6",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<12",
  "python-pptx>=1.0,<2",
  "pywebview>=5.0,<6",
]

[project.optional-dependencies]
packaging = [
  "pyinstaller>=6.0,<7",
  "pyinstaller-hooks-contrib>=2024.0",
]
packaging-win = [
  "pyinstaller>=6.0,<7",
  "pyinstaller-hooks-contrib>=2024.0",
  "comtypes>=1.4",
]
dev = [
  "pytest>=9.0",
]

[project.scripts]
dtm-buildsheet = "dtm_buildsheet.gui_server:main"
dtm-buildsheet-generate = "dtm_buildsheet.generator_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dtm_buildsheet = [
  "ui/index.html",
  "ui/styles.css",
  "ui/js/*.js",
  "ui/js/settings/*.js",
  "resources/config/*.json",
  "resources/templates/*.pptx",
  "resources/templates/*.xlsx",
  "resources/assets/*/*",
]
