# Guardrail checks (AUDIT_REFACTOR_ROADMAP.md §8.1 Step 2).
# Import-boundary lint + dependency audit + static security scan.
# Runs on every PR and on pushes to main, alongside build.yml.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  import-linter:
    name: Import boundaries (import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install package + dev tools
        run: pip install -e ".[dev]"

      - name: Lint import contracts
        run: lint-imports

  pip-audit:
    name: Dependency vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install package
        run: pip install -e .

      - name: Install pip-audit
        run: pip install pip-audit

      # Audits the resolved environment (the local dtm-buildsheet package
      # itself is not on PyPI and is skipped with a warning).
      - name: Audit dependencies
        run: pip-audit --skip-editable

  bandit:
    name: Static security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install bandit
        run: pip install bandit

      # Report-only first pass (§8.1 Step 2): findings are visible in the log
      # but do not fail CI. Tighten to enforcing once the initial findings are
      # triaged in the Phase B ledger.
      - name: Scan src/dtm_buildsheet
        run: bandit -r src/dtm_buildsheet -f txt
        continue-on-error: true
