# Guardrail checks (AUDIT_REFACTOR_ROADMAP.md §8.1 Step 2 / Step 1d).
# Test suite + coverage floor + import-boundary lint + dependency audit +
# static security scan. Runs on every PR and on pushes to main, alongside
# build.yml.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: Test suite + coverage floor (AUDIT_REFACTOR_ROADMAP.md §8.1 Step 1d)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install package + dev tools
        run: pip install -e ".[dev]"

      # Coverage floor is defined once in pyproject.toml
      # ([tool.coverage.report] fail_under) so CI and local runs agree;
      # --cov-fail-under is not repeated here. Golden masters (Step 1a) and
      # contract snapshots (Step 1b) run as part of this same suite once
      # they land — no separate job.
      - name: Run test suite with coverage
        run: pytest --cov=dtm_buildsheet --cov-report=term-missing

  import-linter:
    name: Import boundaries (import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install package + dev tools
        run: pip install -e ".[dev]"

      - name: Lint import contracts
        run: lint-imports

  pip-audit:
    name: Dependency vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # pip-audit includes the installer in its environment. Keep that tool
      # current so a vulnerability in the runner bootstrap does not obscure
      # the application dependency audit below.
      - name: Update package installer
        run: python -m pip install --upgrade "pip>=26.1.2"

      - name: Install package
        run: pip install -e .

      - name: Install pip-audit
        run: pip install pip-audit

      # Audits the resolved environment (the local dtm-buildsheet package
      # itself is not on PyPI and is skipped with a warning).
      - name: Audit dependencies
        run: pip-audit --skip-editable

  bandit:
    name: Static security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install bandit
        run: pip install bandit

      # High-severity findings fail CI. The reviewed medium/low baseline remains
      # tracked in FINDING-020 without emitting a false failing annotation on
      # every otherwise-green run.
      - name: Scan src/dtm_buildsheet
        run: bandit -r src/dtm_buildsheet -lll -f txt
