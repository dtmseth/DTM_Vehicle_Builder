name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (for minor/major releases only)'
        type: choice
        options: [patch, minor, major]
        default: patch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Bump version first, then build from the tagged commit.
  # The commit message contains [skip ci] so the push-back doesn't re-trigger this workflow.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          pip install bump-my-version
          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"
          bump-my-version bump "$BUMP_TYPE"
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          git push origin main --follow-tags

  build-mac:
    needs: version
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e ".[packaging]"

      - name: Build app
        run: python -m PyInstaller --clean -y packaging/pyinstaller/DTM_VehicleBuilder.spec

      - name: Create DMG
        run: |
          mkdir -p /tmp/dmg_staging
          cp -r "dist/DTM Vehicle Builder.app" /tmp/dmg_staging/
          ln -s /Applications /tmp/dmg_staging/Applications
          hdiutil create \
            -volname "DTM Vehicle Builder" \
            -srcfolder /tmp/dmg_staging \
            -ov -format UDZO \
            "dist/DTM_Vehicle_Builder.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: DTM-Vehicle-Builder-Mac
          path: dist/DTM_Vehicle_Builder.dmg

  build-windows:
    needs: version
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e ".[packaging-win]"

      - name: Set version env
        run: |
          echo "APP_VERSION=${{ needs.version.outputs.version }}" >> $env:GITHUB_ENV

      - name: Build app
        run: python -m PyInstaller --clean -y packaging/pyinstaller/DTM_VehicleBuilder.spec

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: DTM-Vehicle-Builder-Windows
          path: dist/DTM_Vehicle_Builder_Setup.exe

  publish:
    needs: [version, build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DTM-Vehicle-Builder-Mac
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: DTM-Vehicle-Builder-Windows
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: DTM Vehicle Builder v${{ needs.version.outputs.version }}
          files: |
            dist/DTM_Vehicle_Builder.dmg
            dist/DTM_Vehicle_Builder_Setup.exe
