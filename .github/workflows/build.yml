name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semantic version bump for a release'
        type: choice
        options: [current, patch, minor, major]
        default: current

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version || steps.current.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read current version
        id: current
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.bump_type == 'current'
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bump_type != 'current'
        run: |
          pip install bump-my-version
          BUMP_TYPE="${{ github.event.inputs.bump_type }}"
          bump-my-version bump "$BUMP_TYPE"
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          git push origin main --follow-tags

      - name: Tag current version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bump_type == 'current'
        run: |
          VERSION="${{ steps.current.outputs.version }}"
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            # bump-my-version creates annotated tags. Compare the commit the
            # tag resolves to, not the annotated tag object's own SHA.
            TAG_SHA="$(git rev-parse "${TAG}^{}")"
            HEAD_SHA="$(git rev-parse HEAD)"
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "::error::${TAG} already exists at ${TAG_SHA}, but this release would use ${HEAD_SHA}. Delete or move the incorrect tag before publishing."
              exit 1
            fi
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

  build-mac:
    needs: version
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e ".[packaging]"

      - name: Require macOS internal-signing credentials
        if: github.event_name == 'workflow_dispatch'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD MACOS_KEYCHAIN_PASSWORD MACOS_CODESIGN_IDENTITY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required macOS internal-signing secret: ${name}"
              exit 1
            fi
          done

      - name: Import macOS internal-signing certificate
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 2
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/dtm-signing.p12"
          CERTIFICATE_PEM="$RUNNER_TEMP/dtm-signing.pem"
          KEYCHAIN_PATH="$RUNNER_TEMP/dtm-signing.keychain-db"
          echo -n "$MACOS_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          openssl pkcs12 -legacy -in "$CERTIFICATE_PATH" -nokeys -passin env:MACOS_CERTIFICATE_PASSWORD | openssl x509 -out "$CERTIFICATE_PEM"
          # User trust opens an authentication dialog and hangs headless macOS
          # runners. Install the public certificate in the noninteractive
          # admin trust domain; the private key remains in our temp keychain.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$KEYCHAIN_PATH" "$CERTIFICATE_PEM"
          # Resolve the configured display name to the exact identity hash.
          # codesign can reject a quoted or otherwise ambiguous display name
          # even when security find-identity lists the expected certificate.
          IDENTITY_HASH="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
              awk -v name="$MACOS_CODESIGN_IDENTITY" 'index($0, name) { print $2; exit }'
          )"
          if ! [[ "$IDENTITY_HASH" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::The configured macOS signing identity was not found in the imported keychain."
            exit 1
          fi
          echo "DTM_INTERNAL_CODESIGN_IDENTITY=$IDENTITY_HASH" >> "$GITHUB_ENV"
          echo "DTM_INTERNAL_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build app
        run: python -m PyInstaller --clean -y packaging/pyinstaller/DTM_VehicleBuilder.spec

      - name: Sign app for internal distribution
        if: github.event_name == 'workflow_dispatch'
        env:
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$DTM_INTERNAL_KEYCHAIN_PATH"
          codesign --force --deep \
            --keychain "$DTM_INTERNAL_KEYCHAIN_PATH" \
            --sign "$DTM_INTERNAL_CODESIGN_IDENTITY" \
            "dist/DTM Vehicle Builder.app"
          codesign --verify --deep --strict --verbose=2 "dist/DTM Vehicle Builder.app"
          codesign --display --requirements - "dist/DTM Vehicle Builder.app"

      - name: Create DMG
        run: |
          mkdir -p /tmp/dmg_staging
          cp -r "dist/DTM Vehicle Builder.app" /tmp/dmg_staging/
          ln -s /Applications /tmp/dmg_staging/Applications
          hdiutil create \
            -volname "DTM Vehicle Builder" \
            -srcfolder /tmp/dmg_staging \
            -ov -format UDZO \
            "dist/DTM_Vehicle_Builder.dmg"

      - name: Sign internal release DMG
        if: github.event_name == 'workflow_dispatch'
        env:
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$DTM_INTERNAL_KEYCHAIN_PATH"
          codesign --force \
            --keychain "$DTM_INTERNAL_KEYCHAIN_PATH" \
            --sign "$DTM_INTERNAL_CODESIGN_IDENTITY" \
            "dist/DTM_Vehicle_Builder.dmg"
          codesign --verify --strict --verbose=2 "dist/DTM_Vehicle_Builder.dmg"

      - name: Remove temporary signing keychain
        if: always() && github.event_name == 'workflow_dispatch'
        timeout-minutes: 1
        # The hosted VM is discarded after the job, including the temporary
        # admin trust entry. Removing it can invoke trust UI, so only delete
        # the temporary keychain here.
        run: security delete-keychain "$RUNNER_TEMP/dtm-signing.keychain-db" || true

      - uses: actions/upload-artifact@v7
        with:
          name: DTM-Vehicle-Builder-Mac
          path: dist/DTM_Vehicle_Builder.dmg

  build-windows:
    needs: version
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e ".[packaging-win]"

      - name: Set version env
        run: |
          echo "APP_VERSION=${{ needs.version.outputs.version }}" >> $env:GITHUB_ENV

      - name: Build app
        run: python -m PyInstaller --clean -y packaging/pyinstaller/DTM_VehicleBuilder.spec

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: DTM-Vehicle-Builder-Windows
          path: dist/DTM_Vehicle_Builder_Setup.exe

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [version, build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so we can `git log` between tags

      - uses: actions/download-artifact@v8
        with:
          name: DTM-Vehicle-Builder-Mac
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: DTM-Vehicle-Builder-Windows
          path: dist

      - name: Generate release notes from git log
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TAG="v${VERSION}"
          # Failed release attempts may leave tags without published releases.
          # Compare with the most recent successful release so its changes are
          # not accidentally omitted from these notes.
          PREVIOUS_TAG=$(gh release list \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // ""')
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..${TAG}"
            HEADER="Changes since ${PREVIOUS_TAG}"
          else
            RANGE="${TAG}"
            HEADER="Initial release"
          fi
          mkdir -p dist/sharepoint
          NOTES_FILE="dist/sharepoint/notes-${VERSION}.md"
          {
            echo "# DTM Vehicle Builder v${VERSION}"
            echo
            echo "_Published $(date -u +'%Y-%m-%d %H:%M UTC')_"
            echo
            echo "## ${HEADER}"
            echo
            # Skip the bump commit itself (auto-generated, no signal).
            git log "${RANGE}" \
              --pretty=format:"- %s" \
              --invert-grep --grep="^bump:" \
              || true
            echo
          } > "${NOTES_FILE}"
          echo "Generated ${NOTES_FILE}:"
          cat "${NOTES_FILE}"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: DTM Vehicle Builder v${{ needs.version.outputs.version }}
          body_path: dist/sharepoint/notes-${{ needs.version.outputs.version }}.md
          files: |
            dist/DTM_Vehicle_Builder.dmg
            dist/DTM_Vehicle_Builder_Setup.exe

      - name: Stage versioned installers for SharePoint
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          cp "dist/DTM_Vehicle_Builder.dmg" "dist/sharepoint/DTM_Vehicle_Builder-${VERSION}.dmg"
          cp "dist/DTM_Vehicle_Builder_Setup.exe" "dist/sharepoint/DTM_Vehicle_Builder_Setup-${VERSION}.exe"

      - name: Acquire Graph access token
        id: graph-token
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token" \
            -d "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "grant_type=client_credentials")
          TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload installers to SharePoint /Releases/
        env:
          GRAPH_TOKEN: ${{ steps.graph-token.outputs.token }}
          DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Installers exceed Graph's 4MB simple-upload threshold. Upload
          # sessions require every non-final fragment to be a multiple of
          # 320 KiB, so use 10 MiB fragments (exactly 32 x 320 KiB).
          set -euo pipefail
          # Graph occasionally returns a transient 429/5xx while accepting a
          # large fragment. Re-sending the same content range is safe for an
          # upload session, so let curl retry those temporary failures.
          CURL_RETRY=(--retry 5 --retry-delay 5 --retry-all-errors)
          upload_via_session() {
            local local_path="$1"
            local remote_name="$2"
            local size
            size=$(stat -c %s "$local_path")
            local chunk_size=$((10 * 1024 * 1024))
            local create_url="https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/root:/Releases/${remote_name}:/createUploadSession"
            local upload_url
            upload_url=$(curl "${CURL_RETRY[@]}" -fsS -X POST "$create_url" \
              -H "Authorization: Bearer ${GRAPH_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"item":{"@microsoft.graph.conflictBehavior":"replace"}}' \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['uploadUrl'])")

            local chunk_path
            chunk_path=$(mktemp "${RUNNER_TEMP}/dtm-sharepoint-upload.XXXXXX")
            trap 'rm -f "$chunk_path"' RETURN
            local offset=0
            local chunk_index=0
            while (( offset < size )); do
              local remaining=$((size - offset))
              local length=$chunk_size
              if (( remaining < length )); then
                length=$remaining
              fi
              local last=$((offset + length - 1))

              dd if="$local_path" of="$chunk_path" \
                bs="$chunk_size" skip="$chunk_index" count=1 status=none
              curl "${CURL_RETRY[@]}" -fsS -X PUT "$upload_url" \
                -H "Content-Length: ${length}" \
                -H "Content-Range: bytes ${offset}-${last}/${size}" \
                --data-binary "@${chunk_path}" > /dev/null

              offset=$((last + 1))
              chunk_index=$((chunk_index + 1))
            done
            echo "Uploaded ${remote_name} (${size} bytes)"
          }
          upload_simple() {
            # Small files (notes markdown) fit in a single PUT — no session needed.
            local local_path="$1"
            local remote_name="$2"
            curl "${CURL_RETRY[@]}" -fsS -X PUT \
              "https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/root:/Releases/${remote_name}:/content" \
              -H "Authorization: Bearer ${GRAPH_TOKEN}" \
              -H "Content-Type: text/markdown" \
              --data-binary "@${local_path}" > /dev/null
            echo "Uploaded ${remote_name}"
          }
          # Notes go up FIRST so Power Automate Flow B can read them when
          # the installer change-trigger fires (same ordering principle as
          # publish-settings-on-merge with its .meta.json sidecar).
          upload_simple        "dist/sharepoint/notes-${VERSION}.md"                       "notes-${VERSION}.md"
          upload_via_session   "dist/sharepoint/DTM_Vehicle_Builder-${VERSION}.dmg"        "DTM_Vehicle_Builder-${VERSION}.dmg"
          upload_via_session   "dist/sharepoint/DTM_Vehicle_Builder_Setup-${VERSION}.exe"  "DTM_Vehicle_Builder_Setup-${VERSION}.exe"
