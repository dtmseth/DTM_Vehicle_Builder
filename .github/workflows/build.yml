name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semantic version bump for a release'
        type: choice
        options: [current, patch, minor, major]
        default: current

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version || steps.current.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read current version
        id: current
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.bump_type == 'current'
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bump_type != 'current'
        run: |
          pip install bump-my-version
          BUMP_TYPE="${{ github.event.inputs.bump_type }}"
          bump-my-version bump "$BUMP_TYPE"
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          git push origin main --follow-tags

      - name: Tag current version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bump_type == 'current'
        run: |
          VERSION="${{ steps.current.outputs.version }}"
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-parse "$TAG")"
            HEAD_SHA="$(git rev-parse HEAD)"
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "::error::${TAG} already exists at ${TAG_SHA}, but this release would use ${HEAD_SHA}. Delete or move the incorrect tag before publishing."
              exit 1
            fi
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

  build-mac:
    needs: version
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e ".[packaging]"

      - name: Build app
        run: python -m PyInstaller --clean -y packaging/pyinstaller/DTM_VehicleBuilder.spec

      - name: Create DMG
        run: |
          mkdir -p /tmp/dmg_staging
          cp -r "dist/DTM Vehicle Builder.app" /tmp/dmg_staging/
          ln -s /Applications /tmp/dmg_staging/Applications
          hdiutil create \
            -volname "DTM Vehicle Builder" \
            -srcfolder /tmp/dmg_staging \
            -ov -format UDZO \
            "dist/DTM_Vehicle_Builder.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: DTM-Vehicle-Builder-Mac
          path: dist/DTM_Vehicle_Builder.dmg

  build-windows:
    needs: version
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e ".[packaging-win]"

      - name: Set version env
        run: |
          echo "APP_VERSION=${{ needs.version.outputs.version }}" >> $env:GITHUB_ENV

      - name: Build app
        run: python -m PyInstaller --clean -y packaging/pyinstaller/DTM_VehicleBuilder.spec

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: DTM-Vehicle-Builder-Windows
          path: dist/DTM_Vehicle_Builder_Setup.exe

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [version, build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so we can `git log` between tags

      - uses: actions/download-artifact@v8
        with:
          name: DTM-Vehicle-Builder-Mac
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: DTM-Vehicle-Builder-Windows
          path: dist

      - name: Generate release notes from git log
        id: notes
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TAG="v${VERSION}"
          # Find the previous tag (one before HEAD's tag). If this is the
          # very first release, fall back to "" which means "since repo
          # genesis" — `git log` with an empty range does the right thing.
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..${TAG}"
            HEADER="Changes since ${PREVIOUS_TAG}"
          else
            RANGE="${TAG}"
            HEADER="Initial release"
          fi
          mkdir -p dist/sharepoint
          NOTES_FILE="dist/sharepoint/notes-${VERSION}.md"
          {
            echo "# DTM Vehicle Builder v${VERSION}"
            echo
            echo "_Published $(date -u +'%Y-%m-%d %H:%M UTC')_"
            echo
            echo "## ${HEADER}"
            echo
            # Skip the bump commit itself (auto-generated, no signal).
            git log "${RANGE}" \
              --pretty=format:"- %s" \
              --invert-grep --grep="^bump:" \
              || true
            echo
          } > "${NOTES_FILE}"
          echo "Generated ${NOTES_FILE}:"
          cat "${NOTES_FILE}"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: DTM Vehicle Builder v${{ needs.version.outputs.version }}
          body_path: dist/sharepoint/notes-${{ needs.version.outputs.version }}.md
          files: |
            dist/DTM_Vehicle_Builder.dmg
            dist/DTM_Vehicle_Builder_Setup.exe

      - name: Stage versioned installers for SharePoint
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          cp "dist/DTM_Vehicle_Builder.dmg" "dist/sharepoint/DTM_Vehicle_Builder-${VERSION}.dmg"
          cp "dist/DTM_Vehicle_Builder_Setup.exe" "dist/sharepoint/DTM_Vehicle_Builder_Setup-${VERSION}.exe"

      - name: Acquire Graph access token
        id: graph-token
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token" \
            -d "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            -d "scope=https://graph.microsoft.com/.default" \
            -d "grant_type=client_credentials")
          TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload installers to SharePoint /Releases/
        env:
          GRAPH_TOKEN: ${{ steps.graph-token.outputs.token }}
          DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Installers exceed Graph's 4MB simple-upload threshold, so we
          # use an upload-session per file. Created-by-resumable: yes,
          # but here we send one big chunk per file (Graph permits up to
          # 60 MiB in a single Content-Range PUT).
          set -euo pipefail
          upload_via_session() {
            local local_path="$1"
            local remote_name="$2"
            local size
            size=$(stat -c %s "$local_path")
            local create_url="https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/root:/Releases/${remote_name}:/createUploadSession"
            local upload_url
            upload_url=$(curl -fsS -X POST "$create_url" \
              -H "Authorization: Bearer ${GRAPH_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"item":{"@microsoft.graph.conflictBehavior":"replace"}}' \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['uploadUrl'])")
            curl -fsS -X PUT "$upload_url" \
              -H "Content-Length: ${size}" \
              -H "Content-Range: bytes 0-$((size-1))/${size}" \
              --data-binary "@${local_path}"
            echo "Uploaded ${remote_name} (${size} bytes)"
          }
          upload_simple() {
            # Small files (notes markdown) fit in a single PUT — no session needed.
            local local_path="$1"
            local remote_name="$2"
            curl -fsS -X PUT \
              "https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/root:/Releases/${remote_name}:/content" \
              -H "Authorization: Bearer ${GRAPH_TOKEN}" \
              -H "Content-Type: text/markdown" \
              --data-binary "@${local_path}" > /dev/null
            echo "Uploaded ${remote_name}"
          }
          # Notes go up FIRST so Power Automate Flow B can read them when
          # the installer change-trigger fires (same ordering principle as
          # publish-settings-on-merge with its .meta.json sidecar).
          upload_simple        "dist/sharepoint/notes-${VERSION}.md"                       "notes-${VERSION}.md"
          upload_via_session   "dist/sharepoint/DTM_Vehicle_Builder-${VERSION}.dmg"        "DTM_Vehicle_Builder-${VERSION}.dmg"
          upload_via_session   "dist/sharepoint/DTM_Vehicle_Builder_Setup-${VERSION}.exe"  "DTM_Vehicle_Builder_Setup-${VERSION}.exe"
