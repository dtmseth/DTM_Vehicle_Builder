name: Build

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e ".[packaging]"

      - name: Build app
        run: python -m PyInstaller --clean -y packaging/pyinstaller/DTM_VehicleBuilder.spec

      - name: Build PKG installer
        run: |
          APP_VERSION=$(python -c "import re; print(re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
          mkdir -p /tmp/pkg_root/Applications
          cp -r "dist/DTM Vehicle Builder.app" "/tmp/pkg_root/Applications/"
          pkgbuild \
            --root /tmp/pkg_root \
            --identifier com.dtm.vehiclebuilder \
            --version "$APP_VERSION" \
            "dist/DTM_Vehicle_Builder.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: DTM-Vehicle-Builder-Mac
          path: dist/DTM_Vehicle_Builder.pkg

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e ".[packaging-win]"

      - name: Read version
        id: version
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          echo "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Build app
        run: python -m PyInstaller --clean -y packaging/pyinstaller/DTM_VehicleBuilder.spec

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss
        env:
          APP_VERSION: ${{ env.APP_VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: DTM-Vehicle-Builder-Windows
          path: dist/DTM_Vehicle_Builder_Setup.exe

  publish:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DTM-Vehicle-Builder-Mac
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: DTM-Vehicle-Builder-Windows
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          files: |
            dist/DTM_Vehicle_Builder.pkg
            dist/DTM_Vehicle_Builder_Setup.exe
