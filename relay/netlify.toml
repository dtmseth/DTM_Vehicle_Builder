[build]
  functions = "netlify/functions"
  publish   = "public"

[functions]
  # The compatibility relay remains CommonJS. The central service uses ESM
  # plus bundled jose/@netlify-blobs deployment adapters.
  node_bundler = "nft"

[[redirects]]
  from = "/v1/quickbooks/*"
  to = "/.netlify/functions/qb-central"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
