[build]
  functions = "netlify/functions"
  publish   = "public"

[functions]
  # Netlify's standard bundler also enables its runtime feature injection
  # (including the Lambda-compatible Netlify Blobs context).
  node_bundler = "esbuild"

[functions."shopmonkey-reconcile"]
  schedule = "*/5 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
