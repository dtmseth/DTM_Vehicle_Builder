[build]
  functions = "netlify/functions"
  publish   = "public"

[functions]
  # No bundler needed — plain CommonJS with no dependencies.
  node_bundler = "nft"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
